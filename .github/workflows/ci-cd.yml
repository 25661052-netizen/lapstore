# LAPSTORE — CI/CD: test, build, scan, push, blue-green và rollback.
# Đặt file này tại .github/workflows/ci-cd.yml khi triển khai dự án.
# Test: ci/. Deploy/rollback: cd/. Hướng dẫn thiết lập: docs/CICD.md.
# GitHub Variables: REGISTRY_HOST, REGISTRY_IMAGE, DEPLOY_DIR, ENABLE_DELIVERY.
# ENABLE_DELIVERY=true: cho phép push/deploy mới; false hoặc chưa đặt: chỉ CI.
# Rollback thủ công trên main vẫn được phép khi ENABLE_DELIVERY=false.
# GitHub Secrets: REGISTRY_USER, REGISTRY_PASSWORD.
# Delivery runner: Linux x64, nhãn lapstore-delivery; có Docker + Compose v2.
# DB demo dùng .env tại DEPLOY_DIR; CI dùng mật khẩu tạm và volume riêng.

name: LapStore CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      action:
        description: "Triển khai bản hiện tại hoặc quay về bản trước"
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  APP_IMAGE: lapstore:ci-${{ github.sha }}

jobs:
  # JOB 1: Kiểm tra trước khi cho phép đưa image lên registry.
  ci:
    name: CI — Test, Build, Scan
    if: ${{ inputs.action != 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: lapstore-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Lấy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Kiểm tra tag phát hành
        if: ${{ github.ref_type == 'tag' }}
        run: |
          # Chỉ nhận v1.0.0, v1.1.0... và commit đã nằm trên main.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Chuẩn bị Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Chuẩn bị Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2

      - name: Quét secret trong source — phát hiện thì dừng
        run: |
          mkdir -p reports
          trivy fs --scanners secret --exit-code 1 --format json --output reports/secrets.json --skip-dirs .git,reports,node_modules --no-progress .

      - name: Cài thư viện và kiểm thử code
        run: |
          npm ci
          npm test 2>&1 | tee reports/unit-test.log

      - name: Build image một lần
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$APP_IMAGE" . 2>&1 | tee reports/docker-build.log

      - name: Quét image — chặn lỗ hổng HIGH hoặc CRITICAL
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output reports/trivy.json --no-progress "$APP_IMAGE"

      - name: Tạo mật khẩu chỉ dùng cho MySQL kiểm thử
        run: |
          for key in DB_PASSWORD MYSQL_ROOT_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - name: Chạy image và MySQL trong Compose riêng của CI
        id: start_app
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Kiểm thử API CRUD trên image vừa build
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run test:api 2>&1 | tee reports/api-test.log

      - name: Đóng gói đúng image đã vượt qua CI
        if: ${{ github.event_name != 'pull_request' && vars.ENABLE_DELIVERY == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: docker save "$APP_IMAGE" | gzip > "$RUNNER_TEMP/lapstore-image.tar.gz"

      - name: Chuyển image cho job delivery
        if: ${{ github.event_name != 'pull_request' && vars.ENABLE_DELIVERY == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lapstore-image
          path: ${{ runner.temp }}/lapstore-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Thu log và dọn riêng môi trường kiểm thử
        if: ${{ always() && steps.start_app.outcome != 'skipped' }}
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/containers.log 2>&1 || true
          # Chỉ xóa volume của project CI; không chạy lệnh này trên production.
          docker compose down -v --remove-orphans

      - name: Lưu báo cáo kể cả khi CI thất bại
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  # JOB 2: Chỉ nhận image đã đạt CI; PR không có quyền chạy job này.
  delivery:
    name: CD — Push, Deploy hoặc Rollback
    needs: ci
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          ((vars.ENABLE_DELIVERY == 'true' && needs.ci.result == 'success' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
           (github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' &&
            github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, linux, x64, lapstore-delivery]
    timeout-minutes: 20
    concurrency:
      group: lapstore-demo-deployment
      cancel-in-progress: false
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

    steps:
      - name: Lấy script triển khai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Kiểm tra cấu hình và script bắt buộc
        run: |
          : "${DEPLOY_DIR:?Chua dat DEPLOY_DIR}"
          [[ "$DEPLOY_DIR" == /* ]]
          test -f cd/deploy.sh
          test -f cd/rollback.sh
          mkdir -p reports
          echo "DOCKER_CONFIG=$RUNNER_TEMP/lapstore-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Nhận image từ CI — không build lại
        if: ${{ inputs.action != 'rollback' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lapstore-image
          path: ${{ runner.temp }}

      - name: Đăng nhập private registry
        id: login
        if: ${{ inputs.action != 'rollback' }}
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          : "${REGISTRY_HOST:?Chua dat REGISTRY_HOST}"
          : "${REGISTRY_IMAGE:?Chua dat REGISTRY_IMAGE}"
          : "${REGISTRY_USER:?Chua dat REGISTRY_USER}"
          : "${REGISTRY_PASSWORD:?Chua dat REGISTRY_PASSWORD}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
            --username "$REGISTRY_USER" --password-stdin

      - name: Push image và ghi nhận digest để triển khai
        if: ${{ inputs.action != 'rollback' }}
        run: |
          docker load -i "$RUNNER_TEMP/lapstore-image.tar.gz"
          tag="sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            # Không ghi đè một bản phát hành đã có.
            if docker manifest inspect "$REGISTRY_IMAGE:$tag" >/dev/null 2>&1; then
              echo "Tag $tag da ton tai; hay tao tag phien ban moi."
              exit 1
            fi
          fi
          image_ref="$REGISTRY_IMAGE:$tag"
          docker tag "$APP_IMAGE" "$image_ref"
          docker push "$image_ref"
          image_digest=$(docker image inspect "$image_ref" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -v prefix="$REGISTRY_IMAGE@" 'index($0, prefix) == 1 {print; exit}')
          [[ "$image_digest" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "APP_IMAGE=$image_digest" >> "$GITHUB_ENV"
          printf '%s\n' "$image_digest" > reports/image.txt

      - name: Blue-green, kiểm tra sức khỏe, đo downtime và tự rollback nếu lỗi
        if: ${{ inputs.action != 'rollback' }}
        run: bash cd/deploy.sh "$APP_IMAGE" "$DEPLOY_DIR" 2>&1 | tee reports/deploy.log

      - name: Chủ động quay về phiên bản trước
        if: ${{ inputs.action == 'rollback' }}
        run: bash cd/rollback.sh "$DEPLOY_DIR" 2>&1 | tee reports/rollback.log

      - name: Lưu kết quả triển khai và đo downtime
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Xóa phiên đăng nhập registry của lần chạy này
        if: ${{ always() && steps.login.outcome != 'skipped' }}
        run: |
          docker logout "$REGISTRY_HOST" || true
          rm -f -- "$DOCKER_CONFIG/config.json"
