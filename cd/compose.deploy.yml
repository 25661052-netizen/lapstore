# Stack CD riêng với stack local/CI. Hai slot dùng cùng một Dockerfile/image.
x-app: &app
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 3s
    timeout: 5s
    retries: 20
    start_period: 10s
  stop_grace_period: 15s
services:
  blue:
    <<: *app
    image: ${BLUE_IMAGE:?Set BLUE_IMAGE}
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_VERSION: ${BLUE_IMAGE}
  green:
    <<: *app
    image: ${GREEN_IMAGE:?Set GREEN_IMAGE}
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_VERSION: ${GREEN_IMAGE}
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./proxy:/etc/nginx/conf.d:ro
    stop_grace_period: 30s
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lapstore
      MYSQL_USER: lapstore
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_data:
