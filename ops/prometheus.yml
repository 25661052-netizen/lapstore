global:
  scrape_interval: 5s
scrape_configs:
  - job_name: cadvisor
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: lapstore
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://gateway/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
