[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[program:cadvisor]
command=/usr/local/bin/cadvisor --listen_ip=127.0.0.1 --port=8080 --docker_only=true --housekeeping_interval=15s --max_housekeeping_interval=30s --store_container_labels=false --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
user=root
priority=10
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/root",GOMEMLIMIT="192MiB",GOMAXPROCS="2"
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:blackbox]
command=/usr/local/bin/blackbox_exporter --config.file=/etc/lapstore/blackbox.yml --web.listen-address=127.0.0.1:9115
user=monitor
priority=20
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/prometheus",GOMEMLIMIT="64MiB",GOMAXPROCS="2"
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/etc/lapstore/prometheus.yml --storage.tsdb.path=/var/lib/prometheus --storage.tsdb.retention.time=7d --storage.tsdb.retention.size=1GB --web.listen-address=0.0.0.0:9090
user=monitor
priority=30
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/prometheus",GOMEMLIMIT="256MiB",GOMAXPROCS="2"
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:grafana]
command=/opt/grafana/bin/grafana server --homepath=/opt/grafana
directory=/opt/grafana
user=grafana
priority=40
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/grafana",GOMEMLIMIT="384MiB",GOMAXPROCS="2",GF_SERVER_HTTP_ADDR="0.0.0.0",GF_SERVER_HTTP_PORT="3000",GF_AUTH_ANONYMOUS_ENABLED="false"
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
